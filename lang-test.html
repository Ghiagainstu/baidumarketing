<meta charset="UTF-8"><title>Lang Test</title>
<style>
.nav-right-group{display:flex;align-items:center;gap:8px;}
.lang-switch{position:relative;}
.lang-switch-btn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:8px;border:1px solid #ccc;background:#fff;cursor:pointer;font-size:.9rem;}
.lang-switch-menu{position:absolute;top:100%;right:0;background:#fff;border:1px solid #ccc;border-radius:8px;min-width:150px;opacity:0;pointer-events:none;transform:translateY(-4px);transition:opacity .2s,transform .2s;z-index:9999;}
.lang-switch-menu.open{opacity:1;pointer-events:auto;transform:translateY(0);}
.lang-switch-item{display:block;padding:10px 16px;text-decoration:none;color:#333;}
.lang-switch-item:hover{background:#f0f0ff;}
</style></head>
<body style="padding:40px;font-family:sans-serif">
<h2>语言切换测试</h2>
<div class="nav-right-group">
  <div class="lang-switch">
    <button class="lang-switch-btn" onclick="event.stopPropagation();toggleLangMenu()">🇺🇸 Language ▼</button>
    <div class="lang-switch-menu" id="langSwitchMenu">
      <a href="#" class="lang-switch-item">🇺🇸 English</a>
      <a href="#" class="lang-switch-item">🇯🇵 日本語</a>
    </div>
  </div>
</div>
<script>
function toggleLangMenu(){var m=document.getElementById('langSwitchMenu');if(m)m.classList.toggle('open');}
document.addEventListener('click',function(e){var m=document.getElementById('langSwitchMenu');var b=document.querySelector('.lang-switch-btn');if(m&&b&&!b.contains(e.target)&&!m.contains(e.target))m.classList.remove('open');});

function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  document.querySelector('meta[name="theme-color"]').content = next === 'dark' ? '#0B0F1A' : '#FFFFFF';
}
(function() {
  const saved = localStorage.getItem('theme');
  if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.setAttribute('data-theme', 'dark');
    document.querySelector('meta[name="theme-color"]').content = '#0B0F1A';
  }
})();
let mobileNavOpen = false;
function toggleMobileNav() {
  const links = document.getElementById('navLinks');
  const hamburger = document.querySelector('.hamburger-icon');
  const closeX = document.querySelector('.close-icon');
  const overlay = document.getElementById('navOverlay');
  mobileNavOpen = !mobileNavOpen;
  if (mobileNavOpen) {
    links.classList.add('open');
    hamburger.style.display = 'none';
    closeX.style.display = 'block';
    overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  } else {
    links.classList.remove('open');
    hamburger.style.display = 'block';
    closeX.style.display = 'none';
    overlay.classList.remove('active');
    document.body.style.overflow = '';
  }
}
document.querySelectorAll('.nav-links a').forEach(link => {
  link.addEventListener('click', () => { if (mobileNavOpen) toggleMobileNav(); });
});
document.querySelectorAll('.obf-email').forEach(function(el){el.textContent=el.dataset.u+'@'+el.dataset.d});
document.querySelectorAll('.obf-email-link').forEach(function(el){var a=el.dataset.u+'@'+el.dataset.d;el.href='mailto:'+a;if(!el.textContent)el.textContent=a});
document.querySelectorAll('.obf-email-icon').forEach(function(el){el.href='mailto:'+el.dataset.u+'@'+el.dataset.d});
window.addEventListener('scroll', () => { document.getElementById('backToTop').classList.toggle('visible', window.scrollY > 600); });</script>
</body></html>
